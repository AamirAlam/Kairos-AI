<svg viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Reuse icon gradients scoped with "l-" prefix -->
    <radialGradient id="l-bg" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#13131f"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="l-vbar" x1="26" y1="64" x2="26" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="l-upper" x1="26" y1="38" x2="61" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="l-lower" x1="26" y1="38" x2="61" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="l-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="l-soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
    <filter id="l-tip" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2"/>
    </filter>

    <!-- Wordmark gradient -->
    <linearGradient id="l-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="80" rx="14" fill="url(#l-bg)"/>

  <!-- Separator line between icon and text zone -->
  <line x1="85" y1="16" x2="85" y2="64" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>

  <!-- ── Icon (scaled ~0.8x, centered in 80x80 left zone) ── -->

  <!-- Node glow -->
  <circle cx="26" cy="38" r="14" fill="url(#l-glow)"/>

  <!-- Vertical bar -->
  <line x1="26" y1="64" x2="26" y2="16" stroke="url(#l-vbar)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Arrowhead -->
  <polyline points="20.5,25 26,15 31.5,25"
            fill="none" stroke="#c7d2fe" stroke-width="1.8"
            stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="20.5,25 26,15 31.5,25"
            fill="none" stroke="#818cf8" stroke-width="3.5"
            stroke-linejoin="round" stroke-linecap="round"
            filter="url(#l-tip)" opacity="0.5"/>

  <!-- Upper arm -->
  <path d="M 26 38 C 38 34 48 26 61 14"
        fill="none" stroke="url(#l-upper)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="43" cy="29" r="1.8" fill="#6ee7b7" opacity="0.75"/>
  <circle cx="61" cy="14" r="3" fill="#065f46"/>
  <circle cx="61" cy="14" r="1.6" fill="#34d399"/>

  <!-- Lower arm -->
  <path d="M 26 38 C 38 43 48 52 61 64"
        fill="none" stroke="url(#l-lower)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="43" cy="49" r="1.8" fill="#7dd3fc" opacity="0.75"/>
  <circle cx="61" cy="64" r="3" fill="#0c4a6e"/>
  <circle cx="61" cy="64" r="1.6" fill="#38bdf8"/>

  <!-- Center node -->
  <circle cx="26" cy="38" r="8" fill="#4f46e5" opacity="0.3" filter="url(#l-soft)"/>
  <circle cx="26" cy="38" r="5.5" fill="#1e1b4b"/>
  <circle cx="26" cy="38" r="4" fill="#3730a3"/>
  <circle cx="26" cy="38" r="2.2" fill="#a5b4fc"/>
  <circle cx="26" cy="64" r="2" fill="#312e81"/>

  <!-- ── Wordmark ── -->
  <text
    x="98" y="46"
    font-family="'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="28"
    font-weight="700"
    letter-spacing="5"
    fill="url(#l-text)"
  >KAIROS</text>

  <!-- Tagline -->
  <text
    x="99" y="60"
    font-family="'SF Mono', 'JetBrains Mono', 'Courier New', monospace"
    font-size="8"
    letter-spacing="1.5"
    fill="#52525b"
  >SEE THE MOMENT. SEIZE IT.</text>
</svg>
