<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#1e1b3a"/>
      <stop offset="100%" stop-color="#0b0b12"/>
    </radialGradient>
    <linearGradient id="vbar" x1="96" y1="190" x2="96" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="60%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="upper" x1="96" y1="130" x2="184" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="lower" x1="96" y1="130" x2="184" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="256" height="256" rx="60" fill="url(#bg)"/>
  <rect x="3" y="3" width="250" height="250" rx="58" fill="none" stroke="#818cf8" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="100" cy="128" r="64" fill="#6366f1" opacity="0.18" filter="url(#soft)"/>

  <!-- vertical bar + upward breakout arrow -->
  <line x1="96" y1="190" x2="96" y2="70" stroke="url(#vbar)" stroke-width="13" stroke-linecap="round"/>
  <polyline points="82,86 96,64 110,86" fill="none" stroke="#e0e7ff" stroke-width="6.5"
            stroke-linejoin="round" stroke-linecap="round"/>

  <!-- arms: signal in (emerald) / action out (sky) -->
  <path d="M96 130 C 128 122 150 102 184 68" fill="none" stroke="url(#upper)" stroke-width="9" stroke-linecap="round"/>
  <path d="M96 130 C 128 138 150 158 184 190" fill="none" stroke="url(#lower)" stroke-width="9" stroke-linecap="round"/>

  <!-- tip nodes -->
  <circle cx="184" cy="68" r="8.5" fill="#34d399"/>
  <circle cx="184" cy="190" r="8.5" fill="#38bdf8"/>

  <!-- centre decision node -->
  <circle cx="96" cy="130" r="15" fill="#1e1b4b"/>
  <circle cx="96" cy="130" r="9.5" fill="#4338ca"/>
  <circle cx="96" cy="130" r="4.5" fill="#c7d2fe"/>
  <circle cx="96" cy="190" r="5" fill="#4338ca"/>
</svg>
